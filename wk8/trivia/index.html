<!DOCTYPE html>

<html lang="en">

<head>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <title>Trivia!</title>
    <script>
        // TODO: Add code to check answers to questions
        // Run this script after DOM is loaded
        document.addEventListener("DOMContentLoaded", function () {
            // Toggle color to green when the correct buttons are clicked
            let rights = document.querySelectorAll(".right");
            for (let i = 0; i < rights.length; i++) {
                rights[i].addEventListener("click", function () {
                    rights[i].style.backgroundColor = "green";
                    document.querySelector("#answer1").innerHTML = "Correct!";
                });
            }

            // Toggle color to red when the wrong button is clicked
            let wrong = document.querySelector(".wrong");
            wrong.addEventListener("click", function () {
                wrong.style.backgroundColor = "red";
                document.querySelector("#answer1").innerHTML = "Incorrect.";
            });

            // Check free response submission
            document
                .querySelector("#freebutton")
                .addEventListener("click", function () {
                    let input = document.querySelector("input");
                    if (
                        input.value.toLowerCase() == "germany" ||
                        input.value.toLowerCase() == "czechia"
                    ) {
                        input.style.backgroundColor = "green";
                        document.querySelector("#answer2").innerHTML = "Correct!";
                    } else {
                        input.style.backgroundColor = "red";
                        document.querySelector("#answer2").innerHTML = "Incorrect.";
                    }
                });
        });
    </script>
</head>

<body>
    <div class="header">
        <h1>Trivia!</h1>
    </div>

    <div class="container">
        <div class="section">
            <h2>Part 1: Multiple Choice </h2>
            <hr>
            <!-- TODO: Add multiple choice question here -->
            <h3>Which country doesn't have English as their official language?</h3>
            <button id="multichoice" name="button" class="right" value="united-states">
                United States
            </button>
            <button id="multichoice" name="button" class="right" value="united-kingdom">
                United Kingdom
            </button>
            <button id="multichoice" name="button" class="wrong" value="south-korea">
                South Korea
            </button>
            <button id="multichoice" name="button" class="right" value="south-africa">
                South Africa
            </button>
            <button id="multichoice" name="button" class="right" value="canada">
                Canada
            </button>
            <p id="answer1"></p>
        </div>

        <div class="section">
            <h2>Part 2: Free Response</h2>
            <hr>
            <!-- TODO: Add free response question here -->
            <h3>Which country is famous for its beer?</h3>
            <label for="freeform">
                <input id="freeform" type="text" />
                <button id="freebutton" type="submit">Submit</button>
                <p id="answer2"></p>
        </div>
    </div>
    <script>

    </script>
</body>

</html>
