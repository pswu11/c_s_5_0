{% extends "layout.html" %}

{% block title %}
    Log In
{% endblock %}

{% block main %}
    {{ balance }}
    <form action="/sell" method="post">
        <div class="mb-3">
            <select class="form-control mx-auto w-auto">
                {% for entry in balance %}
                    <option>{{ entry.symbol }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <input class="form-control mx-auto w-auto" id="shares" name="shares" placeholder="Number of shares" type="number">
        </div>
        <button class="btn btn-primary" type="submit">Sell</button>
    </form>
{% endblock %}
