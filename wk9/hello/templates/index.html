{% extends "layout.html" %}

{% block body %}

    <!-- action="/greet" means this form sends you to greet.html -->
    <!-- Changed from GET to POST method -->
    <form action="/greet" method="get">
        <input name="name" type="text" autocomplete="off" autofocus placeholder="Your name">
        <button type="submit">Greet</button>
    </form>

{% endblock %}
