{% extends "layout.html" %}

{% block body %}

    <!-- action="/greet" means this form sends you to greet.html -->
    <!-- Changed from GET to POST method so it's not visible in the URL, it's still visible in network sectin tho -->
    <form action="/greet" method="post">
        <input name="name" type="text" autocomplete="off" autofocus placeholder="Your name">
        <button type="submit">Greet</button>
    </form>

{% endblock %}
